<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Garut5</title>
  <link rel="icon" type="image/png" href="/favicon.png">

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () {
      (window.vaq = window.vaq || []).push(arguments);
    };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    html, body { margin: 0; height: 100%; }
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbzlr4Tm0hgokj0Zc4bMrF-QceKoUqfybdnBPy6NdMhHYEnxx-1kk_CaW-JN3aHaSuEX/exec"
    allow="clipboard-write; fullscreen">
  </iframe>

  <!-- MASUK KE MONALISA: teruskan ?ke=monalisa ke Apps Script, lalu pindahkan tab ke Monalisa setelah login -->
  <script>
    (function () {
      var bingkai = document.querySelector('iframe');
      if (new URLSearchParams(location.search).get('ke') === 'monalisa' && bingkai) {
        bingkai.src = bingkai.src.split('?')[0] + '?ke=monalisa';
      }
      window.addEventListener('message', function (e) {
        // Hanya terima pesan dari Apps Script portal (domain googleusercontent milik Google)
        if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin)) return;
        var d = e.data;
        if (!d || d.type !== 'pg5-monalisa' || typeof d.url !== 'string') return;
        if (d.url.indexOf('https://monalisa.portalgarut5.web.id/masuk?t=') !== 0) return;
        location.href = d.url;
      });
    })();
  </script>
</body>
</html>
